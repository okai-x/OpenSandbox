# Access for One Platform, which shows each region's sandbox capacity:
# Ready sandbox nodes and their allocatable resources, and the sandbox pods
# (by the one-platform.io/job label) that use them. It also runs Harbor jobs in
# namespace opensandbox-jobs (created by prepare-jobs.sh): a runner Job, its
# ConfigMap and a limits ConfigMap it updates while the job runs, the runner's
# pods and logs; and after a job the deletion of its leftover BatchSandboxes
# by the same label. The server reaches the
# cluster through its DNS endpoint as the service account
# one-platform-sandbox@pranalab-infra, whose token it mints with
# iamcredentials (roles/iam.serviceAccountTokenCreator for the server's
# Workload Identity principal). The DNS endpoint rejects the principal's own
# federated token. The account's project grant roles/container.clusterViewer
# lets it connect and read node pool limits.
#
#   kubectl apply -f deploy/gke/one-platform-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: one-platform-sandbox-observer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: one-platform-sandbox-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: one-platform-sandbox-observer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: one-platform-sandbox@pranalab-infra.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: one-platform-sandbox-observer
  namespace: opensandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: one-platform-sandbox-observer
  namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: one-platform-sandbox-observer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: one-platform-sandbox@pranalab-infra.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: one-platform-sandbox-jobs
  namespace: opensandbox-jobs
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [configmaps]
    # update: a Harbor job's limits change while it runs.
    verbs: [create, get, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: one-platform-sandbox-jobs
  namespace: opensandbox-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: one-platform-sandbox-jobs
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: one-platform-sandbox@pranalab-infra.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: one-platform-sandbox-jobs
  namespace: opensandbox
rules:
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes]
    verbs: [list, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: one-platform-sandbox-jobs
  namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: one-platform-sandbox-jobs
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: one-platform-sandbox@pranalab-infra.iam.gserviceaccount.com

opensandbox-controller:
  controller:
    image:
      repository: asia-southeast1-docker.pkg.dev/pranalab-infra/opensandbox/controller
    snapshot:
      imageCommitterImage: asia-southeast1-docker.pkg.dev/pranalab-infra/opensandbox/image-committer:release-1.2.0
    # controller-runtime /metrics, scraped by the PodMonitoring in observability.yaml.
    metrics:
      enabled: true
      secure: false
  # Business metrics (BatchSandbox counts, allocator latency) go over OTLP to
  # the collector in observability.yaml.
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector.opensandbox-system.svc.cluster.local:4318
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "30000"
opensandbox-server:
  server:
    image:
      repository: asia-southeast1-docker.pkg.dev/pranalab-infra/opensandbox/server
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
    service:
      type: ClusterIP
    env:
      - name: OPENSANDBOX_SERVER_API_KEY
        valueFrom:
          secretKeyRef: {name: opensandbox-api-key, key: api-key}
    gateway:
      enabled: true
      # Clients (the data-synthesis orchestrator) run in this cluster and reach
      # sandboxes through the gateway Service. Out-of-cluster tools use the
      # server proxy (SDK use_server_proxy=True) instead.
      host: "opensandbox-ingress-gateway.opensandbox-system.svc.cluster.local:80"
      gatewayRouteMode: header
  configToml: |
    [server]
    host = "0.0.0.0"
    port = 80
    api_key = ""

    [log]
    level = "INFO"

    [runtime]
    type = "kubernetes"
    execd_image = "asia-southeast1-docker.pkg.dev/pranalab-infra/opensandbox/execd:release-1.2.0"

    [kubernetes]
    kubeconfig_path = ""
    namespace = "opensandbox"
    informer_resync_seconds = 300
    informer_watch_timeout_seconds = 60
    # First pull of the ~2.6GB code-interpreter image on a fresh node exceeds the 60s default.
    sandbox_create_timeout_seconds = 300
    workload_provider = "batchsandbox"
    batchsandbox_template_file = "/etc/opensandbox/example.batchsandbox-template.yaml"

    [egress]
    image = "asia-southeast1-docker.pkg.dev/pranalab-infra/opensandbox/egress:release-1.2.0"
    mode = "dns+nft"
    requests = { cpu = "25m", memory = "64Mi" }
    limits = { cpu = "250m", memory = "256Mi" }

    [otel]
    enabled = true
    endpoint = "http://otel-collector.opensandbox-system.svc.cluster.local:4318/v1/metrics"
    export_interval_millis = 30000
ingress-gateway:
  enabled: true
  gateway:
    image:
      repository: asia-southeast1-docker.pkg.dev/pranalab-infra/opensandbox/ingress
    replicaCount: 2
    gatewayRouteMode: header
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otel-collector.opensandbox-system.svc.cluster.local:4318
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
    service:
      type: ClusterIP
